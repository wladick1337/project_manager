[project]
name = "project-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.scripts]
project-manager = "project_manager:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "alembic/versions",  # сгенерированные миграции проверять не нужно
]

[tool.ruff.lint]
select = [
    "E",   # ошибки стиля PEP8 (pycodestyle)
    "W",   # предупреждения стиля PEP8
    "F",   # поиск багов (неиспользуемые переменные, забытые импорты)
    "I",   # сортировка импортов (isort)
    "B",   # типичные баги и ловушки Python (flake8-bugbear)
    "UP",  # автоматическое обновление старого синтаксиса до Python 3.12 (pyupgrade)
]
ignore = [
    "B008",  # разрешает вызов функций в параметрах (критично для Depends() и Query() в FastAPI)
]

