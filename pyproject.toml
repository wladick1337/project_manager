[project]
name = "project-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.scripts]
project-manager = "project_manager:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
